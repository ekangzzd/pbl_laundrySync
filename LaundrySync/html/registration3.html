<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="..\css\registration3_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form class="form" action="login.html" method="GET">
             <img src="..\assets\images\logo.png" alt="Logo" class="logo">
            <h2>Create an account</h2>
            <p id="step-indicator">Step 3 of 3: Account Information</p>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-step completed"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                </div>
            </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="input-field" required placeholder="Enter your email address">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="input-field" required placeholder="Enter your password">
        </div>

        <div class="form-group">
            <label for="password">Confirm Password</label>
            <input type="password" id="cfpassword" name="cfpassword" class="input-field" required placeholder="Confirm your password">
        </div>

        <button type="submit">Register</button>
        
        </form>
    </div>
</body>
</html>
